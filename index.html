<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chaajao">
<meta name="theme-color" content="#F67280">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Chaajao Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --brand:        #F67280;
  --brand2:       #C06C84;
  --brand3:       #6C5B7B;
  --brand4:       #355C7D;
  --brand-dim:    rgba(246,114,128,0.09);
  --brand-glow:   rgba(246,114,128,0.18);
  --bg:           #FFFFFF;
  --bg2:          #FDFBFC;
  --bg3:          #F6F1F4;
  --bg4:          #EEE6EB;
  --glass:        rgba(108,91,123,0.03);
  --glass2:       rgba(108,91,123,0.06);
  --border:       rgba(108,91,123,0.12);
  --border-m:     rgba(108,91,123,0.26);
  --text:         #2A2438;
  --text2:        #6B5B73;
  --text3:        #9C8CA0;
  --green:        #187A3A;
  --red:          #C0392B;
  --sidebar-w:    240px;
  --safe-top:     env(safe-area-inset-top, 0px);
  --safe-bottom:  env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: calc(70px + var(--safe-bottom));
  padding-top: calc(60px + var(--safe-top));
  font-size: 14px;
  touch-action: pan-x pan-y;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  background-size: 200px 200px;
  opacity: 0.25;
}

/* ─── TOPBAR ─── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: calc(60px + var(--safe-top));
  padding-top: var(--safe-top);
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding-left: 18px; padding-right: 18px;
  box-shadow: 0 1px 12px rgba(246,114,128,0.06);
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 34px; height: 34px;
  border-radius: 9px;
  overflow: hidden;
  box-shadow: 0 0 18px rgba(246,114,128,0.25);
}
.brand-mark img { width: 100%; height: 100%; object-fit: cover; }
.sidebar-head { display: none; }
.brand-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 2px;
  color: var(--brand);
}

.tb-actions { display: flex; align-items: center; gap: 6px; }
.tb-date {
  font-size: 11px; color: var(--text2);
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 10px;
  font-weight: 500; letter-spacing: .3px;
}
.icon-btn {
  width: 34px; height: 34px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--bg3);
  color: var(--text2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.icon-btn:active { background: var(--brand-dim); color: var(--brand); border-color: var(--border-m); }
.icon-btn svg { width: 14px; height: 14px; fill: currentColor; }

/* ─── OFFLINE BANNER ─── */
#offline-banner {
  position: fixed; top: calc(60px + var(--safe-top));
  left: 0; right: 0; z-index: 199;
  background: rgba(246,114,128,0.06);
  border-bottom: 1px solid var(--border-m);
  padding: 9px 18px;
  display: none; align-items: center; gap: 8px;
}
#offline-banner.show { display: flex; }
.offline-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); flex-shrink: 0; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.offline-text { font-size: 12px; color: var(--brand); font-weight: 500; }

/* ─── BOTTOM NAV ─── */
#bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  height: calc(62px + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
  display: flex; align-items: stretch;
  box-shadow: 0 -2px 14px rgba(246,114,128,0.06);
  overflow-x: auto;
}

.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  cursor: pointer; border: none; background: none;
  color: var(--text3); transition: color .2s;
  font-size: 8px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
  position: relative; min-width: 56px;
}
.nav-item svg { width: 18px; height: 18px; fill: currentColor; transition: transform .2s; }
.nav-item::after {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 0; height: 2px; background: var(--brand);
  transition: width .25s cubic-bezier(.4,0,.2,1);
  border-radius: 0 0 3px 3px;
}
.nav-item.active { color: var(--brand); }
.nav-item.active::after { width: 24px; }
.nav-item.active svg { transform: translateY(-1px); }
.nav-item:active { opacity: .6; }

/* ─── PAGES ─── */
.page { display: none; flex-direction: column; gap: 14px; padding: 16px 14px; position: relative; z-index: 1; }
.page.active { display: flex; animation: fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* ─── LOADING ─── */
#loading-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 55vh; gap: 20px; text-align: center; padding: 40px;
}
.spinner-wrap { position: relative; width: 44px; height: 44px; }
.spinner-ring {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--border-m);
  border-top-color: var(--brand);
  animation: spin .8s linear infinite;
  position: absolute; inset: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--brand);
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  box-shadow: 0 0 12px rgba(246,114,128,0.4);
}
.loading-title { font-size: 15px; font-weight: 500; color: var(--text2); }
.loading-sub { font-size: 12px; color: var(--text3); font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px; }

/* ─── ERROR ─── */
#error-screen {
  display: none; flex-direction: column; align-items: center;
  justify-content: center; min-height: 55vh; gap: 14px; text-align: center; padding: 40px;
}
.error-icon { font-size: 40px; }
.error-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 3px; color: var(--text); }
.error-msg { font-size: 13px; color: var(--text2); max-width: 260px; line-height: 1.7; }
.btn-retry {
  background: linear-gradient(135deg, var(--brand2), var(--brand3));
  color: #fff; border: none; border-radius: 10px;
  padding: 11px 28px; font-size: 13px; font-weight: 700; cursor: pointer;
  letter-spacing: .5px; margin-top: 6px;
  box-shadow: 0 4px 20px rgba(246,114,128,0.25);
}

/* ─── SECTION LABELS ─── */
.sec-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px; letter-spacing: 3px; color: var(--text3);
  padding: 0 2px; display: flex; align-items: center; gap: 10px;
}
.sec-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ─── HERO TOTAL CARD ─── */
.hero-card {
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand2) 42%, var(--brand3) 72%, var(--brand4) 100%);
  border-radius: 18px;
  padding: 24px 22px;
  position: relative; overflow: hidden;
  box-shadow: 0 8px 32px rgba(246,114,128,0.22);
}
.hero-card::before {
  content: '';
  position: absolute; top: -60px; right: -40px;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.hero-label {
  font-size: 10px; font-weight: 600; letter-spacing: 2.5px;
  text-transform: uppercase; color: rgba(255,255,255,0.65); margin-bottom: 10px;
}
.hero-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 56px; letter-spacing: -1px; line-height: 1;
  color: #fff;
}
.hero-meta {
  display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap;
}
.hero-delta {
  font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px;
}
.hero-date {
  font-size: 11px; color: rgba(255,255,255,0.5); margin-left: auto;
  font-weight: 500;
}

/* ─── PLATFORM GRID ─── */
.plat-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px;
}
.plat-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px 11px;
  position: relative; overflow: hidden;
  transition: border-color .2s, box-shadow .2s, transform .15s;
  cursor: pointer;
  text-decoration: none;
  display: block;
  -webkit-user-select: none; user-select: none;
}
.plat-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--pc, #555);
  opacity: 0.85;
}
.plat-card:active {
  transform: scale(0.96);
  border-color: var(--border-m);
  box-shadow: 0 2px 12px rgba(246,114,128,0.12);
}
.plat-icon {
  width: 28px; height: 28px; border-radius: 7px;
  background: color-mix(in srgb, var(--pc, #555) 12%, transparent);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 9px;
}
.plat-icon svg { width: 14px; height: 14px; fill: var(--pc, #F67280); }
.plat-name { font-size: 10px; color: var(--text2); font-weight: 500; margin-bottom: 5px; letter-spacing: .2px; }
.plat-num { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: .5px; color: var(--text); line-height: 1; margin-bottom: 5px; }
.plat-delta { font-size: 10px; font-weight: 600; }
.up  { color: var(--green); }
.dn  { color: var(--red); }
.neu { color: var(--text3); }

/* ─── PILL ─── */
.pill {
  font-size: 10px; font-weight: 600; padding: 3px 8px;
  border-radius: 20px; display: inline-flex; align-items: center; gap: 3px;
  white-space: nowrap;
}
.pill.up  { background: rgba(24,122,58,0.10);  color: var(--green); }
.pill.dn  { background: rgba(192,57,43,0.10);  color: var(--red); }
.pill.neu { background: var(--bg4); color: var(--text3); }

/* ─── WEEKLY CARDS ─── */
.week-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px 14px;
}
.week-head {
  display: flex; align-items: center; gap: 9px; margin-bottom: 14px;
}
.week-head-icon {
  width: 30px; height: 30px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.week-head-icon svg { width: 15px; height: 15px; }
.week-head-name { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
.week-cols {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
}
.week-col {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 8px; text-align: center;
}
.week-col.current {
  background: linear-gradient(135deg, rgba(246,114,128,0.07), rgba(246,114,128,0.02));
  border-color: var(--border-m);
}
.week-col-date { font-size: 9px; color: var(--text3); font-weight: 600; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 6px; }
.week-col.current .week-col-date { color: var(--brand3); }
.week-col-val { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--text); letter-spacing: .5px; }
.week-col.current .week-col-val { font-size: 22px; color: var(--brand); }
.week-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
}
.week-footer-lbl { font-size: 11px; color: var(--text3); font-weight: 500; }
.week-footer-val { font-size: 14px; font-weight: 700; }

/* ─── GROWTH SUMMARY ─── */
.growth-box {
  background: linear-gradient(135deg, rgba(246,114,128,0.06), rgba(246,114,128,0.02));
  border: 1px solid var(--border-m);
  border-radius: 14px; padding: 20px 18px;
  display: flex; align-items: center; justify-content: space-between;
}
.growth-label { font-size: 11px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
.growth-num {
  font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 1px; line-height: 1;
}
.growth-sub { font-size: 11px; color: var(--text3); margin-top: 5px; }
.growth-icon {
  width: 52px; height: 52px; border-radius: 50%;
  background: rgba(246,114,128,0.08); border: 1px solid var(--border-m);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.growth-icon svg { width: 24px; height: 24px; fill: var(--brand); }

/* ─── MONTHLY ACCORDION ─── */
.month-accordion {
  border-radius: 14px; overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg2);
}
.month-accordion-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  cursor: pointer;
  border-bottom: 1px solid transparent;
  transition: background .15s;
  -webkit-user-select: none; user-select: none;
}
.month-accordion-header:active { background: var(--brand-dim); }
.month-accordion.open .month-accordion-header {
  border-bottom-color: var(--border);
  background: linear-gradient(135deg, rgba(246,114,128,0.04), rgba(246,114,128,0.01));
}
.month-acc-left { display: flex; flex-direction: column; gap: 2px; }
.month-acc-name {
  font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; color: var(--brand);
}
.month-acc-sub { font-size: 11px; color: var(--text3); font-weight: 400; }
.month-acc-right { display: flex; align-items: center; gap: 10px; }
.month-acc-total { text-align: right; }
.month-acc-total-num { font-size: 14px; font-weight: 700; color: var(--text); }
.month-acc-total-delta { font-size: 11px; font-weight: 600; }
.month-acc-chevron {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: transform .25s;
}
.month-accordion.open .month-acc-chevron { transform: rotate(180deg); }
.month-acc-chevron svg { width: 11px; height: 11px; fill: var(--text3); }

.month-accordion-body {
  display: none; padding: 10px 14px 14px;
}
.month-accordion.open .month-accordion-body { display: block; }

.month-row {
  display: flex; align-items: center; gap: 8px; padding: 5px 0;
}
.month-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.month-nm { font-size: 12px; color: var(--text2); flex: 1; font-weight: 400; }
.month-val { font-size: 12px; font-weight: 600; color: var(--text); min-width: 60px; text-align: right; }
.month-chg { font-size: 11px; font-weight: 600; min-width: 70px; text-align: right; }

/* ─── CHART CARDS ─── */
.chart-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px 14px;
}
.chart-head {
  display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px;
}
.chart-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; color: var(--brand); }
.chart-sub { font-size: 11px; color: var(--text3); margin-top: 3px; font-weight: 400; }
.chart-sel {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); font-family: 'Outfit', sans-serif; font-size: 11px;
  border-radius: 8px; padding: 5px 9px; cursor: pointer; outline: none;
  font-weight: 500; max-width: 110px;
}
.chart-box { position: relative; height: 160px; }

/* ─── STATS ROW ─── */
.stats-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 9px;
}
.stat-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 12px;
}
.stat-lbl { font-size: 10px; color: var(--text3); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 7px; }
.stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: .5px; color: var(--brand); line-height: 1; margin-bottom: 4px; }
.stat-sub { font-size: 11px; color: var(--text3); }

/* ─── TEST DATES SECTION ─── */
.test-hero {
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand2) 42%, var(--brand3) 72%, var(--brand4) 100%);
  border-radius: 18px; padding: 22px 20px;
  box-shadow: 0 8px 32px rgba(246,114,128,0.20);
  position: relative; overflow: hidden;
}
.test-hero::before {
  content: ''; position: absolute; bottom: -40px; right: -40px;
  width: 160px; height: 160px;
  background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.test-hero-label { font-size: 10px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
.test-hero-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: #fff; margin-bottom: 4px; }
.test-hero-sub { font-size: 12px; color: rgba(255,255,255,0.6); }

.test-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px 14px;
  display: flex; align-items: flex-start; gap: 12px;
  transition: border-color .2s;
}
.test-card.past { opacity: 0.55; }
.test-card.soon { border-color: rgba(192,57,43,0.35); background: rgba(192,57,43,0.03); }
.test-badge-wrap { flex-shrink: 0; }
.test-badge {
  font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px;
  background: rgba(246,114,128,0.08); color: var(--brand);
  border-radius: 10px; padding: 6px 10px; text-align: center;
  min-width: 52px;
}
.test-card.past .test-badge { background: var(--bg4); color: var(--text3); }
.test-card.soon .test-badge { background: rgba(192,57,43,0.12); color: var(--red); }
.test-info { flex: 1; }
.test-uni { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.test-date-str { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.test-timer {
  font-size: 11px; font-weight: 600; padding: 3px 8px;
  border-radius: 20px; display: inline-flex; align-items: center; gap: 4px;
  white-space: nowrap;
}
.test-timer.done { background: var(--bg4); color: var(--text3); }
.test-timer.soon { background: rgba(192,57,43,0.10); color: var(--red); }
.test-timer.upcoming { background: rgba(24,122,58,0.10); color: var(--green); }
.test-timer-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: pulse 1.5s infinite; }

/* ─── FOOTER / CREDIT ─── */
.page-footer {
  text-align: center; padding: 12px 0 4px;
  font-size: 11px; color: var(--text3);
  border-top: 1px solid var(--border);
  margin-top: 4px;
}
.page-footer a { color: var(--brand); text-decoration: none; font-weight: 600; }
.page-footer a:hover { text-decoration: underline; }

/* ─── TOAST ─── */
#toast {
  position: fixed; bottom: calc(74px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%);
  background: var(--brand); border-radius: 20px; padding: 9px 18px;
  font-size: 12px; font-weight: 500; color: #fff;
  white-space: nowrap; z-index: 999;
  box-shadow: 0 4px 24px rgba(246,114,128,0.3);
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
#toast.show { opacity: 1; }

@media(min-width:480px) and (max-width:1023px) {
  body { max-width: 520px; margin: 0 auto; }
}

svg.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ══════════════════════════════════════════════════════════
   DESKTOP DASHBOARD LAYOUT — 1024px and up only.
   Mobile layout above is completely untouched.
   ══════════════════════════════════════════════════════════ */
@media(min-width: 1024px) {
  body {
    max-width: none; margin: 0;
    padding-left: var(--sidebar-w);
    padding-top: 68px;
    padding-bottom: 0;
  }
  body::before { left: var(--sidebar-w); }

  /* Topbar sits to the right of the sidebar */
  #topbar {
    left: var(--sidebar-w);
    height: 68px;
    padding-left: 32px; padding-right: 32px;
  }
  #topbar .brand { display: none; } /* brand now lives in sidebar */
  .tb-date { font-size: 12px; padding: 5px 12px; }

  #offline-banner { left: var(--sidebar-w); top: 68px; padding: 10px 32px; }

  /* ─── SIDEBAR (repurposed bottom-nav) ─── */
  #bottom-nav {
    top: 0; bottom: 0; left: 0; right: auto;
    width: var(--sidebar-w); height: 100vh;
    flex-direction: column; align-items: stretch;
    padding: 0 12px 20px;
    border-top: none; border-right: 1px solid var(--border);
    box-shadow: 2px 0 16px rgba(53,92,125,0.05);
    overflow-x: visible; overflow-y: auto;
    z-index: 300;
  }
  .sidebar-head {
    display: flex; align-items: center; gap: 10px;
    padding: 22px 10px 26px;
  }
  .sidebar-head .brand-name { font-size: 20px; }

  .nav-item {
    flex: none; flex-direction: row; justify-content: flex-start;
    gap: 12px; padding: 12px 14px; margin-bottom: 4px;
    border-radius: 11px; min-width: 0;
    font-size: 12.5px; letter-spacing: .3px; text-transform: none; font-weight: 500;
  }
  .nav-item svg { width: 18px; height: 18px; }
  .nav-item::after { display: none; }
  .nav-item:active { opacity: 1; }
  .nav-item:hover { background: var(--bg3); color: var(--text2); }
  .nav-item.active {
    background: linear-gradient(120deg, var(--brand-dim), rgba(53,92,125,0.06));
    color: var(--brand2);
    font-weight: 700;
  }
  .nav-item.active svg { transform: none; }

  /* ─── PAGE CANVAS ─── */
  .page { padding: 28px 36px 40px; gap: 20px; max-width: 1280px; }

  /* Overview: hero + stats on the left, platform widgets flowing on the right */
  #overview-content {
    display: grid !important;
    grid-template-columns: 340px 1fr;
    grid-template-rows: auto auto 1fr;
    gap: 18px 20px !important;
    align-items: start;
  }
  #overview-content .hero-card { grid-column: 1; grid-row: 1; }
  #overview-content .stats-row { grid-column: 1; grid-row: 2; grid-template-columns: 1fr; }
  #overview-content .sec-label { grid-column: 2; grid-row: 1; align-self: start; margin-top: 2px; }
  #overview-content .plat-grid {
    grid-column: 2; grid-row: 2 / span 2;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    align-content: start;
  }
  #overview-content .page-footer { grid-column: 1 / -1; grid-row: 3; }

  /* Weekly: platform cards flow in a responsive grid */
  #weekly-content {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px !important; align-items: start;
  }
  #weekly-content .sec-label,
  #weekly-content .growth-box,
  #weekly-content .page-footer { grid-column: 1 / -1; }

  /* Monthly: accordions in two columns */
  #monthly-content {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 16px !important; align-items: start;
  }
  #monthly-content .sec-label,
  #monthly-content .page-footer { grid-column: 1 / -1; }

  /* Trends: charts side by side */
  #trends-content {
    display: grid !important;
    grid-template-columns: 1fr 1fr;
    gap: 18px !important; align-items: start;
  }
  #trends-content .sec-label,
  #trends-content .page-footer { grid-column: 1 / -1; }
  .chart-box { height: 220px; }

  /* Tests: cards flow in a responsive grid */
  #tests-content {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px !important; align-items: start;
  }
  #tests-content .test-hero,
  #tests-content .sec-label,
  #tests-content .page-footer { grid-column: 1 / -1; }

  .plat-card:hover {
    border-color: var(--border-m);
    box-shadow: 0 6px 20px rgba(53,92,125,0.12);
    transform: translateY(-2px);
  }
  .month-accordion-header:hover { background: var(--brand-dim); }
  .icon-btn:hover { background: var(--brand-dim); color: var(--brand2); border-color: var(--border-m); }
  .btn-retry:hover { filter: brightness(1.06); }
  #toast { left: calc(50% + var(--sidebar-w) / 2); }
}
</style>

function pill(cur, prev) {
  if (cur===null||prev===null) return '<span class="pill neu">—</span>';
  const d = cur - prev, cls = d>0?'up':d<0?'dn':'neu', arr = d>0?'▲':d<0?'▼':'→';
  const pct = prev ? ` ${Math.abs(((d/prev)*100)).toFixed(1)}%` : '';
  return `<span class="pill ${cls}">${arr} ${d>=0?'+':''}${Math.abs(d).toLocaleString()}${pct}</span>`;
}

function deltaText(cur, prev) {
  if (cur===null||prev===null) return '<span class="neu">—</span>';
  const d = cur - prev;
  const cls = d>0?'up':d<0?'dn':'neu';
  const arr = d>0?'▲':d<0?'▼':'→';
  return `<span class="${cls}" style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;">${arr} ${d>=0?'+':''}${Math.abs(d).toLocaleString()}</span>`;
}

async function fetchSheet() {
  if (!navigator.onLine) {
    if (D.length === 0) {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('error-screen').style.display = 'flex';
      document.getElementById('error-msg').textContent = 'Internet nahi hai.';
    }
    return;
  }
  const sp  = SHEET_NAME ? `&sheet=${encodeURIComponent(SHEET_NAME)}` : '';
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0${sp}&range=A4:K500`;
  try {
    const res = await fetch(url); if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    const m = txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
    if (!m) throw new Error('Sheet public nahi hai');
    const json = JSON.parse(m[1]);
    if (json.status === 'error') throw new Error(json.errors?.[0]?.message || 'Error');
    parseGviz(json);
    if (!D.length) throw new Error('Data rows nahi mili');
    renderAll();
  } catch(err) {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display = 'flex';
    document.getElementById('error-msg').textContent = err.message;
  }
}

async function silentRefresh() {
  if (!navigator.onLine) return;
  const sp  = SHEET_NAME ? `&sheet=${encodeURIComponent(SHEET_NAME)}` : '';
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0${sp}&range=A4:K500`;
  try {
    const res = await fetch(url); if (!res.ok) return;
    const txt = await res.text();
    const m = txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/); if (!m) return;
    const json = JSON.parse(m[1]); if (json.status === 'error') return;
    parseGviz(json); if (!D.length) return;
    renderAll();
  } catch(e) {}
}

function parseGviz(json) {
  D = [];
  for (const row of json.table?.rows || []) {
    const c = row.c || []; if (!c[0]) continue;
    const r0 = c[0]; if (!r0 || r0.v === null || r0.v === undefined) continue;
    let dt = null;
    const tryStr = s => {
      if (!s) return null; s = String(s).trim();
      if (/date|week|linkedin|youtube|platform/i.test(s)) return null;
      let m = s.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/);
      if (m) return new Date(+m[1], +m[2], +m[3]);
      m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
      if (m) { const d = new Date(+m[3], +m[2]-1, +m[1]); if (!isNaN(d)) return d; }
      m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
      if (m) { const d = new Date(+m[1], +m[2]-1, +m[3]); if (!isNaN(d)) return d; }
      const d2 = new Date(s); if (!isNaN(d2.getTime()) && d2.getFullYear() >= 2020) return d2;
      return null;
    };
    dt = tryStr(r0.v) || tryStr(r0.f);
    if (!dt && typeof r0.v === 'number') {
      const d = new Date(Math.round((r0.v - 25569) * 86400 * 1000));
      if (!isNaN(d.getTime()) && d.getFullYear() >= 2020) dt = d;
    }
    if (!dt || dt.getFullYear() < 2020) continue;
    const v = cell => {
      if (!cell || cell.v === null || cell.v === undefined) return null;
      if (typeof cell.v === 'number') return cell.v;
      const s = String(cell.v).trim();
      if (s==='-'||s===''||s.toLowerCase()==='n/a') return null;
      const n = parseFloat(s.replace(/[^0-9.-]/g,'')); return isNaN(n) ? null : n;
    };
    D.push({ date:dt, linkedin:v(c[1]), youtube:v(c[2]), facebook_likes:v(c[3]), facebook_follows:v(c[4]), instagram:v(c[5]), tiktok:v(c[6]), whatsapp:v(c[7]), wa_mdcat:v(c[8]), wa_ecat:v(c[9]), wa_bcat:v(c[10]) });
  }
  D.sort((a, b) => a.date - b.date);
}

  <div class="plat-grid">`;

  for (const p of PLATS) {
    const cur = L[p.key], prv = P ? P[p.key] : null;
    const d   = (cur !== null && prv !== null) ? cur - prv : null;
    const cls = d === null ? 'neu' : d > 0 ? 'up' : d < 0 ? 'dn' : 'neu';
    const arr = d === null ? '' : d > 0 ? '▲' : d < 0 ? '▼' : '→';
    html += `
    <a class="plat-card" href="${p.url}" target="_blank" rel="noopener" style="--pc:${p.color};">
      <div class="plat-icon" style="--pc:${p.color};"><svg viewBox="0 0 24 24" style="fill:${p.color}"><use href="#${p.icon}"/></svg></div>
      <div class="plat-name">${p.label}</div>
      <div class="plat-num">${cur !== null ? fn(cur) : '—'}</div>
      <div class="plat-delta ${cls}">${d !== null ? `${arr} ${d >= 0 ? '+' : ''}${Math.abs(d).toLocaleString()}` : '—'}</div>
    </a>`;
  }

  html += `</div>${FOOTER_HTML}`;
  const c = document.getElementById('overview-content');
  c.innerHTML = html; c.style.display = 'flex';
}

/* ─── WEEKLY ─── */
function renderWeekly() {
  const len = D.length;
  const e2 = len >= 1 ? D[len-1] : null;
  const e1 = len >= 2 ? D[len-2] : null;
  const e0 = len >= 3 ? D[len-3] : null;

  let html = `<div class="sec-label">Aakhri 3 Hafte</div>`;

  for (const p of PLATS) {
    const v0 = e0 ? e0[p.key] : null;
    const v1 = e1 ? e1[p.key] : null;
    const v2 = e2 ? e2[p.key] : null;
    html += `<div class="week-card">
      <div class="week-head">
        <div class="week-head-icon" style="background:color-mix(in srgb,${p.color} 12%,transparent);">
          <svg viewBox="0 0 24 24" style="fill:${p.color}"><use href="#${p.icon}"/></svg>
        </div>
        <span class="week-head-name">${p.label}</span>
        ${pill(v2, v1)}
      </div>
      <div class="week-cols">
        <div class="week-col">
          <div class="week-col-date">${e0 ? fds(e0.date) : '—'}</div>
          <div class="week-col-val">${fn(v0)}</div>
        </div>
        <div class="week-col">
          <div class="week-col-date">${e1 ? fds(e1.date) : '—'}</div>
          <div class="week-col-val">${fn(v1)}</div>
        </div>
        <div class="week-col current">
          <div class="week-col-date">Is Hafte</div>
          <div class="week-col-val">${fn(v2)}</div>
        </div>
      </div>
      <div class="week-footer">
        <span class="week-footer-lbl">Tabdili</span>
        <span class="week-footer-val">${deltaText(v2, v1)}</span>
      </div>
    </div>`;
  }

  const diff = (a, b) => (a !== null && b !== null) ? a - b : null;
  const wk2 = e2 && e1 ? TOT_KEYS.reduce((s,k) => s + (diff(e2[k], e1[k]) ?? 0), 0) : null;
  const wk1 = e1 && e0 ? TOT_KEYS.reduce((s,k) => s + (diff(e1[k], e0[k]) ?? 0), 0) : null;
  const wCls = wk2 === null ? 'neu' : wk2 > 0 ? 'up' : wk2 < 0 ? 'dn' : 'neu';

  html += `<div class="growth-box">
    <div class="growth-box-left">
      <div class="growth-label">Is hafte naye followers</div>
      <div class="growth-num ${wCls}">${wk2 !== null ? (wk2 >= 0 ? '+' : '') + Math.abs(wk2).toLocaleString() : '—'}</div>
      ${wk2 !== null && wk1 !== null ? `<div class="growth-sub">Pichle hafte: ${wk1 >= 0 ? '+' : ''}${wk1.toLocaleString()}</div>` : ''}
    </div>
    <div class="growth-icon">
      <svg viewBox="0 0 24 24"><use href="#i-lightning"/></svg>
    </div>
  </div>${FOOTER_HTML}`;

  document.getElementById('weekly-content').innerHTML = html;
}

/* ─── MONTHLY ACCORDION ─── */
function renderMonthly() {
  const byM = {};
  for (const d of D) {
    const k = `${d.date.getFullYear()}-${String(d.date.getMonth()+1).padStart(2,'0')}`;
    byM[k] = d;
  }
  const months = Object.keys(byM).sort().reverse().slice(0, 6);
  const extra  = Object.keys(byM).sort().reverse()[6] || null;

  let html = `<div class="sec-label">Mahina Ba Mahina</div>`;

  for (let i = 0; i < months.length; i++) {
    const cur     = byM[months[i]];
    const prevKey = months[i+1] || extra;
    const prev    = prevKey ? byM[prevKey] : null;
    const mTot  = TOT_KEYS.reduce((s,k) => s + (cur[k]||0), 0);
    const mTotP = prev ? TOT_KEYS.reduce((s,k) => s + (prev[k]||0), 0) : null;
    const mDiff = mTotP !== null ? mTot - mTotP : null;
    const mCls  = mDiff === null ? 'neu' : mDiff > 0 ? 'up' : 'dn';
    const monthLabel = new Date(months[i]+'-02').toLocaleDateString('en-GB', {month:'long', year:'numeric'});
    const accId = 'acc-' + months[i].replace('-','');
    const isOpen = i === 0 ? 'open' : '';

    html += `<div class="month-accordion ${isOpen}" id="${accId}">
      <div class="month-accordion-header" onclick="toggleAccordion('${accId}')">
        <div class="month-acc-left">
          <div class="month-acc-name">${monthLabel}</div>
          <div class="month-acc-sub">${mTot.toLocaleString()} total</div>
        </div>
        <div class="month-acc-right">
          <div class="month-acc-total">
            ${mDiff !== null ? `<div class="month-acc-total-delta ${mCls}">${mDiff >= 0 ? '▲ +' : '▼ '}${Math.abs(mDiff).toLocaleString()}</div>` : ''}
          </div>
          <div class="month-acc-chevron">
            <svg viewBox="0 0 24 24"><use href="#i-chevron-down"/></svg>
          </div>
        </div>
      </div>
      <div class="month-accordion-body">`;

    for (const p of PLATS) {
      const cv = cur[p.key], pv = prev ? prev[p.key] : null;
      const d  = (cv !== null && pv !== null) ? cv - pv : null;
      const cls = d === null ? 'neu' : d > 0 ? 'up' : d < 0 ? 'dn' : 'neu';
      html += `<div class="month-row">
        <div class="month-dot" style="background:${p.color}"></div>
        <span class="month-nm">${p.label}</span>
        <span class="month-val">${cv !== null ? cv.toLocaleString() : '—'}</span>
        <span class="month-chg ${cls}">${d !== null ? (d >= 0 ? '▲ +' : '▼ ') + Math.abs(d).toLocaleString() : '—'}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  html += FOOTER_HTML;
  document.getElementById('monthly-content').innerHTML = html;
}

function toggleAccordion(id) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

/* ─── TRENDS (removed Weekly New Followers) ─── */
let cTrend = null, cDonut = null;

function renderTrends() {
  document.getElementById('trends-content').innerHTML = `
    <div class="sec-label">Growth Charts</div>
    <div class="chart-card">
      <div class="chart-head">
        <div>
          <div class="chart-title">Platform Growth</div>
          <div class="chart-sub">Hafte ba hafte ka record</div>
        </div>
        <select class="chart-sel" id="trend-sel" onchange="updateTrend()">
          <option value="youtube">YouTube</option>
          <option value="linkedin">LinkedIn</option>

          <option value="whatsapp">WhatsApp</option>
        </select>
      </div>
      <div class="chart-box"><canvas id="trendChart"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-head">
        <div>
          <div class="chart-title">Platform Share</div>
          <div class="chart-sub">Latest distribution</div>
        </div>
      </div>
      <div class="chart-box"><canvas id="donutChart"></canvas></div>
    </div>
    ${FOOTER_HTML}`;

const baseOpts = {
  responsive: true, maintainAspectRatio: false,
  plugins: {
    legend: { display: false },
    tooltip: { backgroundColor: '#fff', titleColor: '#2A2438', bodyColor: '#6B5B73', borderColor: 'rgba(246,114,128,0.15)', borderWidth: 1, padding: 10, cornerRadius: 8 }
  },
  scales: {
    x: { ticks: { color: '#9C8CA0', font: { size: 9, family: 'Outfit' }, maxTicksLimit: 8 }, grid: { color: 'rgba(246,114,128,0.05)' }, border: { display: false } },
    y: { ticks: { color: '#9C8CA0', font: { size: 9, family: 'Outfit' } }, grid: { color: 'rgba(246,114,128,0.05)' }, border: { display: false } }
  }
};

function updateTrend() {
  const k = document.getElementById('trend-sel')?.value || 'youtube';
  const fd2 = D.filter(d => d[k] !== null);
  const color = PLATS.find(p => p.key === k)?.color || '#F67280';
  if (cTrend) cTrend.destroy();
  const ctx = document.getElementById('trendChart')?.getContext('2d'); if (!ctx) return;
  const g = ctx.createLinearGradient(0, 0, 0, 160);
  g.addColorStop(0, color + '30'); g.addColorStop(1, color + '00');
  cTrend = new Chart(ctx, {
    type: 'line',
    data: {
      labels: fd2.map(d => fds(d.date)),
      datasets: [{ data: fd2.map(d => d[k]), borderColor: color, backgroundColor: g, borderWidth: 2, pointRadius: 2, pointHoverRadius: 5, fill: true, tension: 0.4 }]
    },
    options: baseOpts
  });
}

function buildDonut() {
  const L  = D[D.length-1];
  const ks = ['youtube','facebook_follows','instagram','linkedin','tiktok','whatsapp'];
  if (cDonut) cDonut.destroy();
  const ctx = document.getElementById('donutChart')?.getContext('2d'); if (!ctx) return;
  cDonut = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ks.map(k => PLATS.find(p => p.key === k)?.label || k),
      datasets: [{ data: ks.map(k => L[k] || 0), backgroundColor: ks.map(k => PLATS.find(p => p.key === k)?.color || '#F67280'), borderWidth: 2, borderColor: '#FDFBFC', hoverOffset: 5 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '65%',
      plugins: {
        legend: { position: 'right', labels: { color: '#6B5B73', font: { size: 10, family: 'Outfit' }, padding: 8, boxWidth: 8 } },
        tooltip: { backgroundColor: '#fff', titleColor: '#2A2438', bodyColor: '#6B5B73', borderColor: 'rgba(246,114,128,0.15)', borderWidth: 1, cornerRadius: 8 }
      }
    }
  });
}

/* ─── TEST DATES ─── */
let timerInterval = null;

function getTestStatus(dateStr) {
  const now = new Date();
  now.setHours(0,0,0,0);
  const parts = dateStr.split('-');
  const testDate = new Date(+parts[0], +parts[1]-1, +parts[2]);
  const diff = testDate - now;
  const days = Math.ceil(diff / (1000*60*60*24));
  return { days, testDate, past: days < 0 };
}

function formatCountdown(days) {
  if (days < 0) return { text: 'Ho chuka', cls: 'done' };
  if (days === 0) return { text: 'AAJ HAI!', cls: 'soon' };
  if (days <= 7) return { text: `${days} din baqi`, cls: 'soon' };
  return { text: `${days} din baqi`, cls: 'upcoming' };
}

function renderTests() {
  // Flatten all test entries and sort by date
  const allTests = [];
  for (const entry of TEST_DATES) {
    for (const d of entry.dates) {
      const status = getTestStatus(d.date);
      allTests.push({ uni: entry.uni, label: d.label, dateStr: d.date, ...status });
    }
  }
  allTests.sort((a, b) => a.testDate - b.testDate);

  const upcoming = allTests.filter(t => !t.past);
  const past     = allTests.filter(t => t.past);

  let html = `
  <div class="test-hero">
    <div class="test-hero-label">📅 Admission Schedule</div>
    <div class="test-hero-title">University Test Dates 2026</div>
    <div class="test-hero-sub">${upcoming.length} upcoming · ${past.length} completed</div>
  </div>
  <div class="sec-label">Upcoming Tests</div>`;

  for (const t of upcoming) {
    const cd = formatCountdown(t.days);
    const isSoon = t.days <= 7;
    html += `<div class="test-card ${isSoon?'soon':''}">
      <div class="test-badge-wrap">
        <div class="test-badge ${isSoon?'soon':''}">${t.testDate.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</div>
      </div>
      <div class="test-info">
        <div class="test-uni">${t.uni}</div>
        <div class="test-date-str">${t.label} · ${t.testDate.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}</div>
        <span class="test-timer ${cd.cls}" id="timer-${t.dateStr.replace(/-/g,'')}-${t.uni.replace(/\s/g,'')}">
          <span class="test-timer-dot"></span>${cd.text}
        </span>
      </div>
    </div>`;
  }

  if (past.length > 0) {
    html += `<div class="sec-label">Completed Tests</div>`;
    for (const t of past.slice().reverse()) {
      html += `<div class="test-card past">
        <div class="test-badge-wrap">
          <div class="test-badge">${t.testDate.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</div>
        </div>
        <div class="test-info">
          <div class="test-uni">${t.uni}</div>
          <div class="test-date-str">${t.label} · ${t.testDate.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}</div>
          <span class="test-timer done">✓ Ho chuka</span>
        </div>
      </div>`;
    }
  }

  html += FOOTER_HTML;
  document.getElementById('tests-content').innerHTML = html;

  // Live countdown updater
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    for (const t of upcoming) {
      const id = `timer-${t.dateStr.replace(/-/g,'')}-${t.uni.replace(/\s/g,'')}`;
      const el = document.getElementById(id);
      if (!el) continue;
      const newStatus = getTestStatus(t.dateStr);
      const cd = formatCountdown(newStatus.days);
      el.className = `test-timer ${cd.cls}`;
      el.innerHTML = `<span class="test-timer-dot"></span>${cd.text}`;
    }
  }, 60000);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

window.addEventListener('load', () => {
  updateOnlineStatus();
  if (navigator.onLine) fetchSheet();
  else {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display   = 'flex';
    document.getElementById('error-msg').textContent = 'Internet nahi hai. Wi-Fi ya data on karein.';
  }
  // Tests render independently of sheet data
  renderTests();
});
</script>
