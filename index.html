<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chaajao">
<meta name="theme-color" content="#F4F6FA">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Chaajao Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:           #F4F6FA;
  --bg2:          #FFFFFF;
  --bg3:          #F1F3F8;
  --bg4:          #E7EAF2;
  --border:       rgba(16,24,40,0.08);
  --border-m:     rgba(16,24,40,0.16);
  --text:         #101828;
  --text2:        #5B6472;
  --text3:        #93A0B2;
  --green:        #16A34A;
  --red:          #E11D48;
  --shadow:       0 4px 16px rgba(16,24,40,0.06);
  --safe-top:     env(safe-area-inset-top, 0px);
  --safe-bottom:  env(safe-area-inset-bottom, 0px);
  --app-max:      480px;

  /* default section theme = Home (matches app icon red) */
  --accent:  #E5231F;
  --accent2: #8E0A0A;
}
body.theme-home      { --accent:#E5231F; --accent2:#8E0A0A; }
body.theme-analytics { --accent:#2E7CF6; --accent2:#123E9E; }
body.theme-dates     { --accent:#FFB020; --accent2:#B96A00; }
body.theme-results   { --accent:#17C978; --accent2:#0B7A47; }

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body { overscroll-behavior:none; }
html { touch-action: pan-y; -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--bg); min-height:100vh; width:100%; overflow-x:hidden; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh; min-height: 100dvh;
  overflow-x: hidden;
  max-width: var(--app-max);
  margin: 0 auto;
  padding-bottom: calc(70px + var(--safe-bottom));
  padding-top: calc(58px + var(--safe-top));
  font-size: 14px;
  touch-action: pan-y;
  position: relative;
  transition: padding-top .25s ease;
}
body.has-offline { padding-top: calc(58px + var(--safe-top) + 34px); }

button, select, input { font-family:'Outfit', sans-serif; -webkit-appearance:none; appearance:none; }

/* ─── SPLASH ─── */
#splash {
  position: fixed; inset: 0; z-index: 9999;
  max-width: var(--app-max); margin: 0 auto;
  background: radial-gradient(circle at 30% 20%, #fff2f2 0%, #ffffff 60%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  transition: opacity .5s ease, transform .5s ease;
}
#splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
.splash-glow {
  position: absolute; width: 230px; height: 230px; border-radius: 50%;
  background: radial-gradient(circle, rgba(229,35,31,0.32), transparent 70%);
  animation: splashPulse 2.4s ease-in-out infinite;
}
@keyframes splashPulse { 0%,100%{ transform:scale(1); opacity:.65; } 50%{ transform:scale(1.16); opacity:1; } }
.splash-logo {
  width: 92px; height: 92px; position: relative; z-index: 2;
  filter: drop-shadow(0 10px 26px rgba(229,35,31,0.45));
  animation: splashFloat 2.6s ease-in-out infinite;
}
.splash-logo img { width: 100%; height: 100%; display: block; }
@keyframes splashFloat { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
.splash-name {
  position: relative; z-index: 2;
  font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 6px; color: var(--text);
}
.splash-tag { position:relative; z-index:2; font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--text3); }
.splash-bar { position:relative; z-index:2; width:110px; height:3px; border-radius:3px; background:rgba(16,24,40,0.08); overflow:hidden; margin-top:4px; }
.splash-bar-fill { height:100%; width:36%; border-radius:3px; background:#E5231F; animation:splashBar 1.1s ease-in-out infinite; }
@keyframes splashBar { 0%{ transform:translateX(-120%); } 100%{ transform:translateX(360%); } }

/* ─── TOPBAR ─── */
#topbar {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 200;
  width: 100%; max-width: var(--app-max);
  height: calc(58px + var(--safe-top));
  padding-top: var(--safe-top);
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding-left: 16px; padding-right: 16px;
}
.brand { display: flex; align-items: center; gap: 9px; }
.brand-mark { width: 28px; height: 28px; flex-shrink: 0; }
.brand-mark img { width: 100%; height: 100%; object-fit: contain; display:block; }
.brand-name { font-family: 'Bebas Neue', sans-serif; font-size: 19px; letter-spacing: 2px; color: #fff; }
.tb-actions { display: flex; align-items: center; gap: 6px; }
.tb-date { font-size: 10.5px; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-weight: 500; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--bg3);
  color: var(--text2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
  touch-action: manipulation;
}
.icon-btn:active { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.icon-btn svg { width: 13px; height: 13px; fill: currentColor; }
.icon-btn.spin svg { animation: spin .8s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── OFFLINE BANNER ─── */
#offline-banner {
  position: fixed; top: calc(58px + var(--safe-top)); left: 50%; transform: translateX(-50%);
  z-index: 199; width: 100%; max-width: var(--app-max);
  background: rgba(255,92,108,0.10); border-bottom: 1px solid var(--border-m);
  padding: 7px 16px; display: none; align-items: center; gap: 8px;
}
#offline-banner.show { display: flex; }
.offline-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.offline-text { font-size: 11px; color: var(--text2); font-weight: 500; }

/* ─── BOTTOM NAV ─── */
#bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 200;
  width: 100%; max-width: var(--app-max);
  height: calc(58px + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex; align-items: stretch;
  overflow-x: auto; overflow-y: hidden; touch-action: pan-x;
  scrollbar-width: none;
}
#bottom-nav::-webkit-scrollbar { display: none; }
.nav-item {
  flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  cursor: pointer; border: none; background: none; color: var(--text3); transition: color .2s;
  font-size: 8px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
  position: relative; min-width: 54px; touch-action: manipulation;
}
.nav-item svg { width: 16px; height: 16px; fill: currentColor; }
.nav-item::after {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 0; height: 2px; background: var(--accent);
  transition: width .25s cubic-bezier(.4,0,.2,1); border-radius: 0 0 3px 3px;
}
.nav-item.active { color: var(--accent); }
.nav-item.active::after { width: 20px; }
.nav-item:active { opacity: .6; }

/* ─── PAGES ─── */
.page { display: none; flex-direction: column; gap: 12px; padding: 16px 14px; position: relative; z-index: 1; }
.page.active { display: flex; animation: fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* ─── ERROR ─── */
#error-screen { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 14px; text-align: center; padding: 40px; }
.error-icon { font-size: 36px; opacity:.85; }
.error-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; color: var(--text); }
.error-msg { font-size: 12.5px; color: var(--text2); max-width: 250px; line-height: 1.7; }
.btn-retry { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 11px 26px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 6px; touch-action: manipulation; }

/* ─── SECTION LABELS ─── */
.sec-label { font-family: 'Bebas Neue', sans-serif; font-size: 12.5px; letter-spacing: 2.5px; color: var(--text3); padding: 0 2px; display: flex; align-items: center; gap: 10px; }
.sec-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ─── HERO CARD ─── */
.hero-card {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  border-radius: 18px; padding: 22px 20px; position: relative; overflow: hidden;
}
.hero-card::before {
  content: ''; position: absolute; top: -50px; right: -35px; width: 160px; height: 160px;
  background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, transparent 70%); border-radius: 50%; pointer-events: none;
}
.hero-label { font-size: 10px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.68); margin-bottom: 8px; }
.hero-num { font-family: 'Bebas Neue', sans-serif; font-size: 50px; letter-spacing: -1px; line-height: 1; color: #fff; }
.hero-meta { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.hero-delta { font-size: 12px; font-weight: 600; color:#fff; background: rgba(255,255,255,0.14); padding: 3px 9px; border-radius: 20px; }
.hero-date { font-size: 10.5px; color: rgba(255,255,255,0.55); margin-left: auto; font-weight: 500; }

.top-strip {
  display: flex; align-items: center; gap: 8px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 9px 12px; font-size: 11.5px; color: var(--text2);
}
.top-strip b { color: var(--text); font-weight: 700; }
.top-strip .tag { margin-left:auto; font-size:10px; color:var(--accent); font-weight:700; }

/* ─── PLATFORM GRID ─── */
.plat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.plat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
.plat-top { display:flex; align-items:center; gap:7px; margin-bottom:10px; }
.plat-dot { width:8px; height:8px; border-radius:50%; background:var(--pc,#888); flex-shrink:0; }
.plat-name { font-size: 11px; color: var(--text2); font-weight: 500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.plat-open { width: 20px; height: 20px; border-radius: 50%; background: var(--bg3); color: var(--text3); display: flex; align-items: center; justify-content: center; flex-shrink:0; cursor:pointer; touch-action: manipulation; }
.plat-open svg { width: 9px; height: 9px; fill: currentColor; }
.plat-open:active { background: color-mix(in srgb, var(--pc,#888) 25%, transparent); color: var(--pc,#888); }
.plat-num { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: .5px; color: var(--text); line-height: 1; margin-bottom: 5px; }
.plat-delta { font-size: 10.5px; font-weight: 600; }
.up  { color: var(--green); }
.dn  { color: var(--red); }
.neu { color: var(--text3); }

/* ─── PILL ─── */
.pill { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 20px; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.pill.up  { background: rgba(52,211,153,0.14);  color: var(--green); }
.pill.dn  { background: rgba(255,92,108,0.14); color: var(--red); }
.pill.neu { background: var(--bg4); color: var(--text3); }

/* ─── WEEKLY CARDS ─── */
.week-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.week-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.week-dot { width:9px; height:9px; border-radius:50%; background:var(--pc,#888); flex-shrink:0; }
.week-head-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.week-open { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; background: var(--bg3); color: var(--text3); display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; }
.week-open svg { width: 9px; height: 9px; fill: currentColor; }
.week-open:active { background: color-mix(in srgb, var(--pc,#888) 25%, transparent); color: var(--pc,#888); }
.week-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
.week-col { background: var(--bg3); border-radius: 10px; padding: 9px 6px; text-align: center; }
.week-col.current { background: color-mix(in srgb, var(--accent) 16%, var(--bg3)); }
.week-col-date { font-size: 8.5px; color: var(--text3); font-weight: 600; letter-spacing: .4px; text-transform: uppercase; margin-bottom: 5px; }
.week-col.current .week-col-date { color: var(--accent); }
.week-col-val { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: var(--text); }
.week-col.current .week-col-val { font-size: 19px; color: #fff; }
.week-foot { display:flex; justify-content:flex-end; }

/* ─── GROWTH SUMMARY ─── */
.growth-box { background: color-mix(in srgb, var(--accent) 14%, var(--bg2)); border: 1px solid var(--border-m); border-radius: 14px; padding: 16px; display: flex; align-items: center; justify-content: space-between; }
.growth-label { font-size: 10.5px; font-weight: 500; color: var(--text2); margin-bottom: 5px; }
.growth-num { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 1px; line-height: 1; }
.growth-sub { font-size: 10.5px; color: var(--text3); margin-top: 4px; }
.growth-icon { width: 42px; height: 42px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 22%, transparent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.growth-icon svg { width: 19px; height: 19px; fill: var(--accent); }

/* ─── MONTHLY ACCORDION ─── */
.month-accordion { border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: var(--bg2); box-shadow: var(--shadow); }
.month-accordion-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; cursor: pointer; transition: background .15s; touch-action: manipulation; }
.month-accordion-header:active { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.month-accordion.open .month-accordion-header { background: color-mix(in srgb, var(--accent) 8%, transparent); border-bottom:1px solid var(--border); }
.month-acc-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1.5px; color: var(--accent); }
.month-acc-sub { font-size: 10.5px; color: var(--text3); }
.month-acc-right { display: flex; align-items: center; gap: 9px; flex-shrink:0; }
.month-acc-total-delta { font-size: 11px; font-weight: 600; }
.month-acc-chevron { width: 20px; height: 20px; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .25s; }
.month-accordion.open .month-acc-chevron { transform: rotate(180deg); }
.month-acc-chevron svg { width: 10px; height: 10px; fill: var(--text3); }
.month-accordion-body { display: none; padding: 6px 14px 12px; }
.month-accordion.open .month-accordion-body { display: block; }
.month-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.month-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.month-nm { font-size: 11.5px; color: var(--text2); flex: 1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.month-val { font-size: 11.5px; font-weight: 600; color: var(--text); min-width: 54px; text-align: right; }
.month-chg { font-size: 10.5px; font-weight: 600; min-width: 62px; text-align: right; }

/* ─── CHART CARDS ─── */
.chart-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 15px 14px; box-shadow: var(--shadow); }
.chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap:8px; }
.chart-title { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 1.5px; color: var(--accent); }
.chart-sel { background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-size: 16px; border-radius: 8px; padding: 4px 8px; cursor: pointer; outline: none; max-width: 112px; transform: scale(.72); transform-origin: top right; }
.chart-box { position: relative; height: 145px; }

/* ─── DATES / TESTS ─── */
.hero-mini {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  border-radius: 18px; padding: 18px; position: relative; overflow: hidden;
}
.hero-mini::before { content:''; position:absolute; bottom:-30px; right:-30px; width:130px; height:130px; background:radial-gradient(circle, rgba(255,255,255,0.12), transparent 70%); border-radius:50%; }
.hero-mini-label { font-size: 9.5px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.65); margin-bottom: 7px; }
.hero-mini-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1.5px; color: #fff; }
.hero-mini-sub { font-size: 11px; color: rgba(255,255,255,0.65); margin-top:3px; }

.test-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 13px; padding: 12px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
.test-card.past { opacity: 0.45; }
.test-card.soon { border-color: color-mix(in srgb, var(--red) 45%, transparent); }
.test-badge { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: .5px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); border-radius: 9px; padding: 6px 9px; text-align: center; min-width: 46px; flex-shrink:0; }
.test-card.past .test-badge { background: var(--bg4); color: var(--text3); }
.test-card.soon .test-badge { background: rgba(255,92,108,0.16); color: var(--red); }
.test-info { flex: 1; min-width:0; }
.test-uni { font-size: 13px; font-weight: 700; color: var(--text); }
.test-date-str { font-size: 11px; color: var(--text2); margin-top:1px; margin-bottom: 5px; }
.test-timer { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; }
.test-timer.done { background: var(--bg4); color: var(--text3); }
.test-timer.soon { background: rgba(255,92,108,0.14); color: var(--red); }
.test-timer.upcoming { background: rgba(52,211,153,0.14); color: var(--green); }
.test-timer-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: pulse 1.5s infinite; }

/* ─── RESULTS ─── */
.results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.result-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 16px 10px; text-align: center; box-shadow: var(--shadow); }
.result-badge { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--accent); margin-bottom: 3px; }
.result-sub { font-size: 10px; color: var(--text3); margin-bottom: 9px; }
.result-pill { font-size: 8.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; padding: 4px 9px; border-radius: 20px; background: var(--bg3); color: var(--text2); }
.cta-card { display: flex; align-items: center; gap: 12px; background: color-mix(in srgb, var(--accent) 14%, var(--bg2)); border: 1px solid var(--border-m); border-radius: 14px; padding: 14px; }
.cta-text { flex: 1; min-width:0; }
.cta-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
.cta-sub { font-size: 10px; color: var(--text3); line-height: 1.4; }
.cta-btn { background: var(--accent); color: #fff; text-decoration: none; font-size: 10.5px; font-weight: 700; padding: 8px 14px; border-radius: 20px; white-space: nowrap; flex-shrink:0; touch-action: manipulation; }

/* ─── FOOTER ─── */
.page-footer { text-align: center; padding: 10px 0 4px; font-size: 10.5px; color: var(--text3); border-top: 1px solid var(--border); margin-top: 4px; }
.page-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }

/* ─── TOAST ─── */

function pill(cur, prev) {
  if (cur===null||prev===null) return '<span class="pill neu">—</span>';
  const d = cur - prev, cls = d>0?'up':d<0?'dn':'neu', arr = d>0?'▲':d<0?'▼':'→';

async function fetchSheet() {
  if (!navigator.onLine) {
    if (D.length === 0) {
      document.getElementById('error-screen').style.display = 'flex';
      document.getElementById('error-msg').textContent = 'No internet connection.';
      hideSplash();
    }
    return;
  }
  const sp  = SHEET_NAME ? `&sheet=${encodeURIComponent(SHEET_NAME)}` : '';
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0${sp}&range=A4:K500`;
  try {
    const res = await fetch(url); if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    const m = txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
    if (!m) throw new Error('Sheet not public');
    const json = JSON.parse(m[1]);
    if (json.status === 'error') throw new Error(json.errors?.[0]?.message || 'Error');
    parseGviz(json);
    if (!D.length) throw new Error('No data found');
    renderAll();
    hideSplash();
  } catch(err) {
    document.getElementById('error-screen').style.display = 'flex';
    document.getElementById('error-msg').textContent = err.message;
    hideSplash();
  }
}

async function silentRefresh() {
  if (!navigator.onLine) return;
  const sp  = SHEET_NAME ? `&sheet=${encodeURIComponent(SHEET_NAME)}` : '';
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0${sp}&range=A4:K500`;
  try {
    const res = await fetch(url); if (!res.ok) return;
    const txt = await res.text();
    const m = txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/); if (!m) return;
    const json = JSON.parse(m[1]); if (json.status === 'error') return;
    parseGviz(json); if (!D.length) return;
    renderAll();
  } catch(e) {}
}

async function manualRefresh() {
  if (!navigator.onLine) { showToast('No internet'); return; }
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spin');
  showToast('Refreshing...');
  await fetchSheet();
  setTimeout(() => btn.classList.remove('spin'), 400);
}

function parseGviz(json) {
  D = [];
  for (const row of json.table?.rows || []) {
    const c = row.c || []; if (!c[0]) continue;
    const r0 = c[0]; if (!r0 || r0.v === null || r0.v === undefined) continue;
    let dt = null;
    const tryStr = s => {
      if (!s) return null; s = String(s).trim();
      if (/date|week|linkedin|youtube|platform/i.test(s)) return null;
      let m = s.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/);
      if (m) return new Date(+m[1], +m[2], +m[3]);
      m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
      if (m) { const d = new Date(+m[3], +m[2]-1, +m[1]); if (!isNaN(d)) return d; }
      m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
      if (m) { const d = new Date(+m[1], +m[2]-1, +m[3]); if (!isNaN(d)) return d; }
      const d2 = new Date(s); if (!isNaN(d2.getTime()) && d2.getFullYear() >= 2020) return d2;
      return null;
    };
    dt = tryStr(r0.v) || tryStr(r0.f);
    if (!dt && typeof r0.v === 'number') {
      const d = new Date(Math.round((r0.v - 25569) * 86400 * 1000));
      if (!isNaN(d.getTime()) && d.getFullYear() >= 2020) dt = d;
    }
    if (!dt || dt.getFullYear() < 2020) continue;
    const v = cell => {
      if (!cell || cell.v === null || cell.v === undefined) return null;
      if (typeof cell.v === 'number') return cell.v;
      const s = String(cell.v).trim();
      if (s==='-'||s===''||s.toLowerCase()==='n/a') return null;
      const n = parseFloat(s.replace(/[^0-9.-]/g,'')); return isNaN(n) ? null : n;
    };
    D.push({ date:dt, linkedin:v(c[1]), youtube:v(c[2]), facebook_likes:v(c[3]), facebook_follows:v(c[4]), instagram:v(c[5]), tiktok:v(c[6]), whatsapp:v(c[7]), wa_mdcat:v(c[8]), wa_ecat:v(c[9]), wa_bcat:v(c[10]) });
  }
  D.sort((a, b) => a.date - b.date);
}

function renderAll() {
  const last   = D[D.length - 1];
  const dateEl = document.getElementById('tb-date');
  dateEl.textContent = fds(last.date); dateEl.style.display = 'block';
  document.getElementById('error-screen').style.display = 'none';
  renderOverview(); renderWeekly(); renderMonthly(); renderTrends();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(silentRefresh, 5 * 60 * 1000);
}

/* ─── HOME / OVERVIEW ─── */
function renderOverview() {
  const L = D[D.length-1], P = D.length > 1 ? D[D.length-2] : null;
  const tot  = TOT_KEYS.reduce((s,k) => s + (L[k]||0), 0);
  const totP = P ? TOT_KEYS.reduce((s,k) => s + (P[k]||0), 0) : null;
  const tDiff = totP !== null ? tot - totP : null;

  let topPlat = null, topVal = 0;
  for (const p of PLATS) { if ((L[p.key]||0) > topVal) { topVal = L[p.key]||0; topPlat = p; } }

  let html = `
  <div class="hero-card">
    <div class="hero-label">Total Community</div>
    <div class="hero-num">${tot.toLocaleString()}</div>
    <div class="hero-meta">
      ${tDiff !== null ? `<div class="hero-delta">${tDiff>=0?'▲':'▼'} ${tDiff >= 0 ? '+' : ''}${Math.abs(tDiff).toLocaleString()}</div>` : ''}
      <div class="hero-date">${fd(L.date)}</div>
    </div>
  </div>
  <div class="top-strip">Top platform: <b>${topPlat?.label || '—'}</b><span class="tag">${fn(topVal)}</span></div>

  <div class="sec-label">Platforms</div>
  <div class="plat-grid">`;

  for (const p of PLATS) {
    const cur = L[p.key], prv = P ? P[p.key] : null;
    const d   = (cur !== null && prv !== null) ? cur - prv : null;
    const cls = d === null ? 'neu' : d > 0 ? 'up' : d < 0 ? 'dn' : 'neu';
    const arr = d === null ? '' : d > 0 ? '▲' : d < 0 ? '▼' : '→';
    html += `
    <div class="plat-card">
      <div class="plat-top">
        <span class="plat-dot" style="background:${p.color}"></span>
        <span class="plat-name">${p.label}</span>
        <button class="plat-open" style="--pc:${p.color}" onclick="window.open('${p.url}','_blank')" aria-label="Open ${p.label}"><svg viewBox="0 0 24 24"><use href="#i-open"/></svg></button>
      </div>
      <div class="plat-num">${cur !== null ? fn(cur) : '—'}</div>
      <div class="plat-delta ${cls}">${d !== null ? `${arr} ${d >= 0 ? '+' : ''}${Math.abs(d).toLocaleString()}` : '—'}</div>
    </div>`;
  }

  html += `</div>${FOOTER_HTML}`;
  const c = document.getElementById('overview-content');
  c.innerHTML = html; c.style.display = 'flex';
}

/* ─── WEEKLY ─── */
function renderWeekly() {
  const len = D.length;
  const e2 = len >= 1 ? D[len-1] : null;
  const e1 = len >= 2 ? D[len-2] : null;
  const e0 = len >= 3 ? D[len-3] : null;

  let html = `<div class="sec-label">Last 3 Weeks</div>`;

  for (const p of PLATS) {
    const v0 = e0 ? e0[p.key] : null;
    const v1 = e1 ? e1[p.key] : null;
    const v2 = e2 ? e2[p.key] : null;
    html += `<div class="week-card">
      <div class="week-head">
        <span class="week-dot" style="background:${p.color}"></span>
        <span class="week-head-name">${p.label}</span>
      </div>
      <div class="week-cols">
        <div class="week-col"><div class="week-col-date">${e0 ? fds(e0.date) : '—'}</div><div class="week-col-val">${fn(v0)}</div></div>
        <div class="week-col"><div class="week-col-date">${e1 ? fds(e1.date) : '—'}</div><div class="week-col-val">${fn(v1)}</div></div>
        <div class="week-col current"><div class="week-col-date">This Week</div><div class="week-col-val">${fn(v2)}</div></div>
      </div>
      <div class="week-foot">${pill(v2, v1)}</div>
    </div>`;
  }

  const diff = (a, b) => (a !== null && b !== null) ? a - b : null;
  const wk2 = e2 && e1 ? TOT_KEYS.reduce((s,k) => s + (diff(e2[k], e1[k]) ?? 0), 0) : null;
  const wk1 = e1 && e0 ? TOT_KEYS.reduce((s,k) => s + (diff(e1[k], e0[k]) ?? 0), 0) : null;
  const wCls = wk2 === null ? 'neu' : wk2 > 0 ? 'up' : wk2 < 0 ? 'dn' : 'neu';

  html += `<div class="growth-box">
    <div>
      <div class="growth-label">New followers this week</div>
      <div class="growth-num ${wCls}">${wk2 !== null ? (wk2 >= 0 ? '+' : '') + Math.abs(wk2).toLocaleString() : '—'}</div>
      ${wk2 !== null && wk1 !== null ? `<div class="growth-sub">Last week: ${wk1 >= 0 ? '+' : ''}${wk1.toLocaleString()}</div>` : ''}
    </div>
    <div class="growth-icon"><svg viewBox="0 0 24 24"><use href="#i-lightning"/></svg></div>
  </div>${FOOTER_HTML}`;

  document.getElementById('weekly-content').innerHTML = html;
}

/* ─── MONTHLY ─── */
function renderMonthly() {
  const byM = {};
  for (const d of D) {
    const k = `${d.date.getFullYear()}-${String(d.date.getMonth()+1).padStart(2,'0')}`;
    byM[k] = d;
  }
  const months = Object.keys(byM).sort().reverse().slice(0, 6);
  const extra  = Object.keys(byM).sort().reverse()[6] || null;

  let html = `<div class="sec-label">Month by Month</div>`;

  for (let i = 0; i < months.length; i++) {
    const cur     = byM[months[i]];
    const prevKey = months[i+1] || extra;
    const prev    = prevKey ? byM[prevKey] : null;
    const mTot  = TOT_KEYS.reduce((s,k) => s + (cur[k]||0), 0);
    const mTotP = prev ? TOT_KEYS.reduce((s,k) => s + (prev[k]||0), 0) : null;
    const mDiff = mTotP !== null ? mTot - mTotP : null;
    const mCls  = mDiff === null ? 'neu' : mDiff > 0 ? 'up' : 'dn';
    const monthLabel = new Date(months[i]+'-02').toLocaleDateString('en-GB', {month:'long', year:'numeric'});
    const accId = 'acc-' + months[i].replace('-','');
    const isOpen = i === 0 ? 'open' : '';

    html += `<div class="month-accordion ${isOpen}" id="${accId}">
      <div class="month-accordion-header" onclick="toggleAccordion('${accId}')">
        <div>
          <div class="month-acc-name">${monthLabel}</div>
          <div class="month-acc-sub">${mTot.toLocaleString()} total</div>
        </div>
        <div class="month-acc-right">
          ${mDiff !== null ? `<div class="month-acc-total-delta ${mCls==='up'?'up':mCls==='dn'?'dn':'neu'}">${mDiff >= 0 ? '▲ +' : '▼ '}${Math.abs(mDiff).toLocaleString()}</div>` : ''}
          <div class="month-acc-chevron"><svg viewBox="0 0 24 24"><use href="#i-chevron-down"/></svg></div>
        </div>
      </div>
      <div class="month-accordion-body">`;

    for (const p of PLATS) {
      const cv = cur[p.key], pv = prev ? prev[p.key] : null;
      const d  = (cv !== null && pv !== null) ? cv - pv : null;
      const cls = d === null ? 'neu' : d > 0 ? 'up' : d < 0 ? 'dn' : 'neu';
      html += `<div class="month-row">
        <div class="month-dot" style="background:${p.color}"></div>
        <span class="month-nm">${p.label}</span>
        <span class="month-val">${cv !== null ? cv.toLocaleString() : '—'}</span>
        <span class="month-chg ${cls}">${d !== null ? (d >= 0 ? '▲ +' : '▼ ') + Math.abs(d).toLocaleString() : '—'}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  html += FOOTER_HTML;
  document.getElementById('monthly-content').innerHTML = html;
}

function toggleAccordion(id) { document.getElementById(id).classList.toggle('open'); }

/* ─── TRENDS ─── */
let cTrend = null, cDonut = null;

function renderTrends() {
  document.getElementById('trends-content').innerHTML = `
    <div class="sec-label">Growth Charts</div>
    <div class="chart-card">
      <div class="chart-head">
        <div class="chart-title">Platform Growth</div>
        <select class="chart-sel" id="trend-sel" onchange="updateTrend()">
          <option value="youtube">YouTube</option>
          <option value="linkedin">LinkedIn</option>
          <option value="facebook_follows">Facebook</option>
          <option value="instagram">Instagram</option>
          <option value="tiktok">TikTok</option>
          <option value="whatsapp">WhatsApp</option>
        </select>
      </div>
      <div class="chart-box"><canvas id="trendChart"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-head"><div class="chart-title">Platform Share</div></div>
      <div class="chart-box"><canvas id="donutChart"></canvas></div>
    </div>
    ${FOOTER_HTML}`;
  setTimeout(() => { updateTrend(); buildDonut(); }, 80);
}

const baseOpts = {
  responsive: true, maintainAspectRatio: false, animation: { duration: 400 },
  plugins: { legend: { display: false }, tooltip: { backgroundColor: '#FFFFFF', titleColor: '#101828', bodyColor: '#5B6472', borderColor: 'rgba(46,124,246,0.3)', borderWidth: 1, padding: 10, cornerRadius: 8 } },
  scales: {
    x: { ticks: { color: '#93A0B2', font: { size: 9, family: 'Outfit' }, maxTicksLimit: 7 }, grid: { color: 'rgba(16,24,40,0.06)' }, border: { display: false } },
    y: { ticks: { color: '#93A0B2', font: { size: 9, family: 'Outfit' } }, grid: { color: 'rgba(16,24,40,0.06)' }, border: { display: false } }
  }
};

function updateTrend() {
  const k = document.getElementById('trend-sel')?.value || 'youtube';
  const fd2 = D.filter(d => d[k] !== null);
  const color = PLATS.find(p => p.key === k)?.color || '#2E7CF6';
  if (cTrend) cTrend.destroy();
  const ctx = document.getElementById('trendChart')?.getContext('2d'); if (!ctx) return;
  const g = ctx.createLinearGradient(0, 0, 0, 145);
  g.addColorStop(0, color + '40'); g.addColorStop(1, color + '00');
  cTrend = new Chart(ctx, { type: 'line', data: { labels: fd2.map(d => fds(d.date)), datasets: [{ data: fd2.map(d => d[k]), borderColor: color, backgroundColor: g, borderWidth: 2, pointRadius: 2, pointHoverRadius: 5, fill: true, tension: 0.4 }] }, options: baseOpts });
}

function buildDonut() {
  const L  = D[D.length-1];
  const ks = ['youtube','facebook_follows','instagram','linkedin','tiktok','whatsapp'];
  if (cDonut) cDonut.destroy();
  const ctx = document.getElementById('donutChart')?.getContext('2d'); if (!ctx) return;
  cDonut = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: ks.map(k => PLATS.find(p => p.key === k)?.label || k), datasets: [{ data: ks.map(k => L[k] || 0), backgroundColor: ks.map(k => PLATS.find(p => p.key === k)?.color || '#2E7CF6'), borderWidth: 2, borderColor: '#FFFFFF', hoverOffset: 5 }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '65%', animation: { duration: 400 },
      plugins: { legend: { position: 'right', labels: { color: '#5B6472', font: { size: 10, family: 'Outfit' }, padding: 8, boxWidth: 8 } }, tooltip: { backgroundColor: '#FFFFFF', titleColor: '#101828', bodyColor: '#5B6472', borderColor: 'rgba(46,124,246,0.3)', borderWidth: 1, cornerRadius: 8 } } }
  });
}

/* ─── DATES (TESTS) ─── */
let timerInterval = null;

function getTestStatus(dateStr) {
  const now = new Date(); now.setHours(0,0,0,0);
  const parts = dateStr.split('-');
  const testDate = new Date(+parts[0], +parts[1]-1, +parts[2]);
  const days = Math.ceil((testDate - now) / (1000*60*60*24));
  return { days, testDate, past: days < 0 };
}
function formatCountdown(days) {
  if (days < 0) return { text: 'Done', cls: 'done' };
  if (days === 0) return { text: 'TODAY!', cls: 'soon' };
  if (days <= 7) return { text: `${days}d left`, cls: 'soon' };
  return { text: `${days}d left`, cls: 'upcoming' };
}

function renderTests() {
  const allTests = [];
  for (const entry of TEST_DATES) for (const d of entry.dates) allTests.push({ uni: entry.uni, label: d.label, dateStr: d.date, ...getTestStatus(d.date) });
  allTests.sort((a, b) => a.testDate - b.testDate);
  const upcoming = allTests.filter(t => !t.past);
  const past     = allTests.filter(t => t.past);

  let html = `
  <div class="hero-mini">
    <div class="hero-mini-label">Admission Schedule</div>
    <div class="hero-mini-title">Test Dates 2026</div>
    <div class="hero-mini-sub">${upcoming.length} upcoming · ${past.length} completed</div>
  </div>
  <div class="sec-label">Upcoming</div>`;

  for (const t of upcoming) {
    const cd = formatCountdown(t.days);
    const isSoon = t.days <= 7;
    html += `<div class="test-card ${isSoon?'soon':''}">
      <div class="test-badge ${isSoon?'soon':''}">${t.testDate.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</div>
      <div class="test-info">
        <div class="test-uni">${t.uni}</div>
        <div class="test-date-str">${t.label}</div>
        <span class="test-timer ${cd.cls}" id="timer-${t.dateStr.replace(/-/g,'')}-${t.uni.replace(/\s/g,'')}"><span class="test-timer-dot"></span>${cd.text}</span>
      </div>
    </div>`;
  }

  if (past.length > 0) {
    html += `<div class="sec-label">Completed</div>`;
    for (const t of past.slice().reverse()) {
      html += `<div class="test-card past">
        <div class="test-badge">${t.testDate.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</div>
        <div class="test-info">
          <div class="test-uni">${t.uni}</div>
          <div class="test-date-str">${t.label}</div>
          <span class="test-timer done">✓ Done</span>
        </div>
      </div>`;
    }
  }

  html += FOOTER_HTML;
  document.getElementById('tests-content').innerHTML = html;

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    for (const t of upcoming) {
      const el = document.getElementById(`timer-${t.dateStr.replace(/-/g,'')}-${t.uni.replace(/\s/g,'')}`);
      if (!el) continue;
      const cd = formatCountdown(getTestStatus(t.dateStr).days);
      el.className = `test-timer ${cd.cls}`;
      el.innerHTML = `<span class="test-timer-dot"></span>${cd.text}`;
    }
  }, 60000);
}

/* ─── RESULTS ─── */
function renderResults() {
  let html = `
  <div class="hero-mini">
    <div class="hero-mini-label">Chaajao Results</div>
    <div class="hero-mini-title">Result Portal</div>
    <div class="hero-mini-sub">All results in one place</div>
  </div>
  <div class="sec-label">Categories</div>
  <div class="results-grid">`;

  for (const r of RESULTS) {
    html += `<div class="result-card">
      <div class="result-badge">${r.label}</div>
      <div class="result-sub">${r.sub}</div>
      <span class="result-pill">Coming Soon</span>
    </div>`;
  }

  html += `</div>
  ${FOOTER_HTML}`;

  document.getElementById('results-content').innerHTML = html;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

window.addEventListener('load', () => {
  updateOnlineStatus();
  if (navigator.onLine) fetchSheet();
  else {
    document.getElementById('error-screen').style.display = 'flex';
    document.getElementById('error-msg').textContent = 'No internet. Turn on Wi-Fi or data.';
    hideSplash();
  }
  renderTests();
  renderResults();
});
</script>
