<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chaajao Analytics — Under Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#F67280; --brand2:#C06C84; --brand3:#6C5B7B; --brand4:#355C7D;
    --text:#2A2438; --text2:#6B5B73;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Outfit',sans-serif;
    height:100dvh;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#FFFFFF 0%,#FDF2F4 45%,#F3ECF0 100%);
    color:var(--text);
    text-align:center;
    padding:20px;
    position:relative;
  }

  .blob{
    position:fixed;border-radius:50%;
    filter:blur(50px);opacity:.3;
    animation:float 9s ease-in-out infinite;
    pointer-events:none;
  }
  .blob1{width:200px;height:200px;background:var(--brand);top:-60px;left:-60px;}
  .blob2{width:180px;height:180px;background:var(--brand4);bottom:-60px;right:-60px;animation-delay:2s;}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(15px,-18px) scale(1.06);}
  }

  .card{max-width:320px;width:100%;position:relative;z-index:2;}

  .badge{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,var(--brand),var(--brand2),var(--brand3));
    background-size:200% 200%;
    animation:shimmer 3s ease infinite;
    color:#fff;font-size:10px;font-weight:700;letter-spacing:2px;
    text-transform:uppercase;padding:8px 16px;border-radius:20px;
    box-shadow:0 8px 24px rgba(246,114,128,0.28);
    margin-bottom:18px;
  }
  @keyframes shimmer{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(28px,7.5vw,38px);letter-spacing:1.5px;line-height:1.1;
    background:linear-gradient(135deg,var(--brand2),var(--brand3),var(--brand4));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:12px;
  }

  p{
    color:var(--text2);font-size:13.5px;line-height:1.6;
  }

  .progress-wrap{
    margin:26px auto 0;
    width:100%;max-width:220px;height:8px;border-radius:20px;
    background:rgba(108,91,123,0.1);
    overflow:hidden;position:relative;
  }
  .progress-bar{
    position:absolute;top:0;left:-40%;height:100%;width:40%;
    border-radius:20px;
    background:linear-gradient(90deg,var(--brand),var(--brand3));
    animation:slide 1.6s ease-in-out infinite;
  }
  @keyframes slide{
    0%{left:-40%;}
    100%{left:100%;}
  }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="card">
    <span class="badge"><span class="dot"></span> Under Maintenance</span>
    <h1>WE'LL BE<br>BACK SOON</h1>
    <p>We're currently upgrading Chaajao Analytics to improve your experience. Please check back shortly.</p>
    <div class="progress-wrap"><div class="progress-bar"></div></div>
  </div>
</body>
</html>
